<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receta Studio</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
<style>
  html { background: #1a0b30; }
  body { visibility: hidden; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a0b30; }
  html.is-desktop body { visibility: visible; }
  .stores { display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 24px; }
  .stores a { display: block; line-height: 0; }
</style>
<script>
(function () {
  var apple = "https://apps.apple.com/us/app/receta-studio/id6775508328";
  var play = "https://play.google.com/store/apps/details?id=com.spinlightproductions.recetastudio";
  var ua = navigator.userAgent || "";
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios) { location.replace(apple); return; }
  if (/Android/i.test(ua)) { location.replace(play); return; }
  document.documentElement.classList.add("is-desktop");
})();
</script>
<noscript><style>body{visibility:visible}</style></noscript>
</head>
<body>
  <div class="stores">
    <a href="https://apps.apple.com/us/app/receta-studio/id6775508328"><img src="/assets/brand/badge-app-store-en.svg" width="180" height="60" alt="Download on the App Store"></a>
    <a href="https://play.google.com/store/apps/details?id=com.spinlightproductions.recetastudio"><img src="/assets/brand/badge-google-play-en.svg" width="203" height="60" alt="Get it on Google Play"></a>
  </div>
</body>
</html>
